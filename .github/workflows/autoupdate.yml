name: SEV 3.4 AutoUpdate
on:
  push:
    paths:
      - .github/workflows/autoupdate.yml
      - updates/AutoUpdate.cs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - shell: pwsh
        run: |
          Expand-Archive SEV_V3_3_Quellcode.zip -DestinationPath src34 -Force
          Copy-Item updates/AutoUpdate.cs src34/
          $p = 'src34/Program.cs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('static void Main(){ApplicationConfiguration.Initialize();', 'static void Main(string[] args){if(AutoUpdate.Apply(args)) return; ApplicationConfiguration.Initialize();')
          $s = $s.Replace('try{Directory.CreateDirectory(dir);','try{if(await AutoUpdate.CheckAsync()){Close();return;} Directory.CreateDirectory(dir);')
          $s = $s.Replace('Generator 3.3','Generator 3.4')
          Set-Content $p $s
          if (!$s.Contains('AutoUpdate.Apply(args)') -or !$s.Contains('await AutoUpdate.CheckAsync()')) { throw 'Updater integration failed' }
          $proj = Get-Content src34/SEV.csproj -Raw
          Set-Content src34/SEV.csproj ($proj.Replace('3.3.0','3.4.0'))
          dotnet publish src34/SEV.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SEV-3.4
          path: publish/
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.4.0 publish/OMSI-SEV-Generator.exe --title 'OMSI SEV Generator 3.4' --notes 'Automatische Folgeupdates, bisherige Oberfläche und Vorlagen.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
