name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish SEV.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - shell: pwsh
        run: |
          $p = Start-Process ./publish/OMSI-SEV-Generator.exe -ArgumentList '--smoke-test' -PassThru
          if (!$p.WaitForExit(30000)) { $p.Kill(); throw 'Starttest timeout' }
          if ($p.ExitCode -ne 0) { throw 'Starttest failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: OMSI-SEV-Windows
          path: publish/OMSI-SEV-Generator.exe
